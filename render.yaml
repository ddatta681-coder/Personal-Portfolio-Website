 services:
  - type: web
    name: debarpan-portfolio
    env: python
    buildCommand: pip install -r requirements.txt && npm install && npm run build
    startCommand: gunicorn server:app
    envVars:
      - key: MAIL_ADDRESS
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false